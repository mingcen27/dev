<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penampil PDF Full Screen</title>
    <style>
        /* Mengatur agar halaman tidak memiliki margin/jarak putih */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah scrollbar ganda */
            background-color: #525659; /* Warna latar belakang standar viewer PDF */
        }

        /* Mengatur iframe agar memenuhi layar 100% */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Menggunakan iframe untuk memuat PDF -->
    <!-- Ganti 'Presentasi1.pdf' jika nama file Anda berbeda -->
    <iframe src="Presentasi1.pdf" title="Dokumen PDF">
        
        <!-- Teks alternatif jika browser tidak mendukung PDF viewer -->
        <div style="text-align: center; padding: 20px; color: white; font-family: sans-serif;">
            <p>Browser Anda tidak mendukung tampilan PDF secara langsung.</p>
            <a href="Presentasi1.pdf" style="color: #4da6ff; text-decoration: none; font-size: 18px;">
                Klik di sini untuk mengunduh PDF
            </a>
        </div>

    </iframe>

</body>
</html>
